<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickBooks Bridge</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#f4f6f8;
    --surface:#ffffff;
    --surface-2:#eef1f4;
    --border:#d8dee4;
    --text:#171b20;
    --text-muted:#5b6472;
    --accent:#2f6f6b;
    --accent-ink:#ffffff;
    --danger:#b3432f;
    --danger-bg:#fbeae6;
    --ok-bg:#e8f2ee;
    --code-bg:#f0f3f5;
    --shadow: 0 1px 2px rgba(20,24,29,0.04), 0 8px 24px -12px rgba(20,24,29,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1214;
      --surface:#171b1e;
      --surface-2:#1e2327;
      --border:#2b3136;
      --text:#e9edef;
      --text-muted:#9aa4ab;
      --accent:#5fb3ac;
      --accent-ink:#0b1414;
      --danger:#e2836c;
      --danger-bg:#2c1a16;
      --ok-bg:#16241f;
      --code-bg:#12161a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-inline:16px;
    padding-block:48px;
    display:flex;
    justify-content:center;
  }
  .mono{
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .wrap{ width:100%; max-width:640px; }

  .eyebrow{
    font-size:12.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    font-weight:600;
    margin:0 0 8px;
  }

  h1{
    font-size:clamp(24px, 4.2vw, 30px);
    line-height:1.15;
    margin:0 0 6px;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }

  .sub{
    color:var(--text-muted);
    font-size:15px;
    line-height:1.5;
    margin:0 0 28px;
    max-width:52ch;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:600;
    padding:5px 12px 5px 10px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .status-pill.ok{ background:var(--ok-bg); color:var(--accent); }
  .status-pill.err{ background:var(--danger-bg); color:var(--danger); }
  .status-pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:16px;
  }

  .card h2{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--text-muted);
    margin:0 0 12px;
  }

  .url-row{
    display:flex;
    gap:8px;
    align-items:stretch;
  }
  .url-box{
    flex:1;
    min-width:0;
    background:var(--code-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.5;
    word-break:break-all;
    color:var(--text);
    max-height:140px;
    overflow-y:auto;
  }

  button{
    font:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:0 16px;
    font-size:13.5px;
    font-weight:600;
    background:var(--accent);
    color:var(--accent-ink);
    white-space:nowrap;
    transition:filter 0.15s ease, transform 0.05s ease;
  }
  button:hover{ filter:brightness(1.08); }
  button:active{ transform:translateY(1px); }
  button:focus-visible, .url-box:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  button.copied{ background:var(--ok-bg); color:var(--accent); }

  .fields{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:14px;
  }
  .field{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    background:var(--surface-2);
    border-radius:10px;
    border:1px solid var(--border);
  }
  .field .label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    font-weight:600;
    width:92px;
    flex-shrink:0;
  }
  .field .value{
    flex:1;
    min-width:0;
    font-size:13px;
    overflow-x:auto;
    white-space:nowrap;
    padding-bottom:1px;
  }
  .field button{
    padding:5px 11px;
    font-size:12px;
    flex-shrink:0;
  }

  ol{
    margin:0;
    padding-left:20px;
    color:var(--text-muted);
    font-size:14px;
    line-height:1.7;
  }
  ol b{ color:var(--text); font-weight:600; }

  .footnote{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size:12.5px;
    color:var(--text-muted);
    line-height:1.5;
    margin-top:20px;
  }
  .footnote svg{ flex-shrink:0; margin-top:2px; }

  .error-msg{
    font-size:14px;
    color:var(--danger);
    background:var(--danger-bg);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:4px;
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Panda Windows &amp; Doors &middot; Purchase Order Tool</p>
  <h1 id="heading">Reading response&hellip;</h1>
  <p class="sub" id="subhead">One moment.</p>

  <div id="content"></div>

  <p class="footnote">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
    <span>This page only reads your own browser's address bar. Nothing on it is sent anywhere &mdash; copy the value below straight into the <code class="mono">qbo_auth_setup.py</code> prompt running on your computer.</span>
  </p>
</div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var realmId = params.get('realmId');
  var state = params.get('state');
  var error = params.get('error');
  var errorDesc = params.get('error_description');
  var fullUrl = window.location.href;

  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var content = document.getElementById('content');

  function copyBtn(text, label){
    label = label || 'Copy';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    btn.addEventListener('click', function(){
      var reset = function(){ btn.textContent = label; btn.classList.remove('copied'); };
      var ok = function(){
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(reset, 1400);
      };
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text).then(ok).catch(function(){ fallbackCopy(text, ok); });
      } else {
        fallbackCopy(text, ok);
      }
    });
    return btn;
  }

  function fallbackCopy(text, ok){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); ok(); } catch(e){}
    document.body.removeChild(ta);
  }

  function field(labelText, value){
    var row = document.createElement('div');
    row.className = 'field';

    var label = document.createElement('span');
    label.className = 'label';
    label.textContent = labelText;
    row.appendChild(label);

    var val = document.createElement('span');
    val.className = 'value mono';
    val.textContent = value;
    row.appendChild(val);

    row.appendChild(copyBtn(value, 'Copy'));
    return row;
  }

  if (error) {
    heading.textContent = 'Connection declined';
    subhead.textContent = 'QuickBooks did not authorize the connection.';

    var pill = document.createElement('span');
    pill.className = 'status-pill err';
    pill.innerHTML = '<span class="dot"></span> Not connected';
    content.appendChild(pill);

    var card = document.createElement('div');
    card.className = 'card';
    var msg = document.createElement('div');
    msg.className = 'error-msg';
    msg.textContent = (error || 'error') + (errorDesc ? ' — ' + errorDesc : '');
    card.appendChild(msg);
    var ol = document.createElement('ol');
    ol.innerHTML = '<li>Go back to the terminal running <b>qbo_auth_setup.py</b>.</li><li>Run it again and approve access when QuickBooks asks.</li>';
    card.appendChild(ol);
    content.appendChild(card);
    return;
  }

  if (!code) {
    heading.textContent = 'No authorization code found';
    subhead.textContent = 'This page is meant to be reached only as a redirect from QuickBooks.';
    var pill2 = document.createElement('span');
    pill2.className = 'status-pill err';
    pill2.innerHTML = '<span class="dot"></span> Nothing to connect';
    content.appendChild(pill2);
    return;
  }

  heading.textContent = 'QuickBooks connected';
  subhead.textContent = 'Copy the line below and paste it into the qbo_auth_setup.py prompt in your terminal.';

  var okPill = document.createElement('span');
  okPill.className = 'status-pill ok';
  okPill.innerHTML = '<span class="dot"></span> Authorized';
  content.appendChild(okPill);

  var urlCard = document.createElement('div');
  urlCard.className = 'card';
  var h2 = document.createElement('h2');
  h2.textContent = 'Paste this into the terminal';
  urlCard.appendChild(h2);

  var row = document.createElement('div');
  row.className = 'url-row';
  var box = document.createElement('div');
  box.className = 'url-box mono';
  box.tabIndex = 0;
  box.textContent = fullUrl;
  row.appendChild(box);
  row.appendChild(copyBtn(fullUrl, 'Copy URL'));
  urlCard.appendChild(row);

  var fields = document.createElement('div');
  fields.className = 'fields';
  fields.appendChild(field('Auth code', code));
  if (realmId) fields.appendChild(field('Realm ID', realmId));
  urlCard.appendChild(fields);

  content.appendChild(urlCard);

  var stepsCard = document.createElement('div');
  stepsCard.className = 'card';
  var h2b = document.createElement('h2');
  h2b.textContent = 'Next step';
  stepsCard.appendChild(h2b);
  var ol2 = document.createElement('ol');
  ol2.innerHTML = '<li>Switch to the terminal running <b>qbo_auth_setup.py</b>.</li>' +
                   '<li>Paste the full URL above when it asks for it, then press Enter.</li>' +
                   '<li>It will exchange this for QuickBooks tokens and confirm your company name.</li>';
  stepsCard.appendChild(ol2);
  content.appendChild(stepsCard);
})();
</script>
</body>
</html>
