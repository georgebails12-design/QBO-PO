# Deploys webapp/ to the live PO app (po.pandawd.online) whenever main changes.
#
# The server copy at /home/george/po-app is a plain folder (not a git clone),
# run by the po-app systemd service. This workflow copies the code over it and
# restarts the service. Files the app itself writes on the server are never
# overwritten -- see EXCLUDES below.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_SSH_KEY      private key whose public half is in root's authorized_keys
#   VPS_KNOWN_HOSTS  the server's host key line, so the connection is verified
name: Deploy PO app

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-po-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-po-app
  cancel-in-progress: false

env:
  VPS_HOST: 45.82.73.224
  VPS_USER: root
  APP_DIR: /home/george/po-app
  APP_OWNER: george
  SERVICE: po-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Copy code to server
        run: |
          # Runtime files owned by the server -- never overwrite these.
          EXCLUDES=(
            --exclude=./qbo_config.json
            --exclude=./qbo_tokens.json
            --exclude=./qbo_reference_cache.json
            --exclude=./users.json
            --exclude=./flask_secret_key
            --exclude=./po_categories.json
            --exclude=./downloads
            --exclude=./venv
            --exclude=./__pycache__
          )
          tar -C webapp "${EXCLUDES[@]}" -czf - . \
            | ssh "$VPS_USER@$VPS_HOST" "tar -C '$APP_DIR' -xzf - && chown -R $APP_OWNER:$APP_OWNER '$APP_DIR'"

      - name: Install requirements and restart
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            set -e
            sudo -u $APP_OWNER '$APP_DIR/venv/bin/pip' install -q -r '$APP_DIR/requirements.txt'
            systemctl restart $SERVICE
            sleep 3
            systemctl is-active $SERVICE
            curl -fsS -o /dev/null -w 'login page: HTTP %{http_code}\n' http://127.0.0.1:8030/login
          "
